<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="glass-container">
    <!-- Шапка -->
    <div class="header">
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <i class="fas fa-shield-halbed"></i>
      </div>
      <div class="header-text">
        <h1>Прометей<span class="badge">MV3</span></h1>
        <p class="subtitle">Блокировщик рекламы</p>
      </div>
      <div class="status-indicator" id="status-indicator"></div>
    </div>

    <!-- Переключатель -->
    <div class="power-card">
      <div class="power-switch-container">
        <span class="power-label">Защита</span>
        <label class="power-switch">
          <input type="checkbox" id="toggle-blocking">
          <span class="power-slider">
            <i class="fas fa-power-off"></i>
          </span>
        </label>
      </div>
      <div class="power-stats" id="status-text">Активен</div>
    </div>

    <!-- Статистика в строку -->
    <div class="stats-row">
      <div class="stat-block">
        <i class="fas fa-ban stat-icon-small"></i>
        <div class="stat-block-info">
          <span class="stat-block-label">Заблокировано</span>
          <span class="stat-block-value" id="blocked-count">0</span>
        </div>
      </div>

      <div class="stat-divider"></div>

      <div class="stat-block">
        <i class="fas fa-shield-alt stat-icon-small"></i>
        <div class="stat-block-info">
          <span class="stat-block-label">Правил</span>
          <span class="stat-block-value" id="rules-count">7</span>
        </div>
      </div>

      <div class="stat-divider"></div>

      <div class="stat-block">
        <i class="fas fa-user-lock stat-icon-small"></i>
        <div class="stat-block-info">
          <span class="stat-block-label">Моих</span>
          <span class="stat-block-value" id="custom-rules-count">0</span>
        </div>
      </div>
    </div>

    <!-- Блокировка по домену -->
    <div class="section">
      <div class="section-header">
        <i class="fas fa-globe"></i>
        <h3>Добавить домен</h3>
      </div>

      <div class="domain-input-container">
        <i class="fas fa-search input-icon"></i>
        <input type="text" id="domain" placeholder="example.com" class="domain-input">
        <button id="add-domain" class="add-btn">
          <i class="fas fa-plus"></i>
        </button>
      </div>
    </div>

    <!-- Список правил -->
    <div class="rules-section">
      <div class="rules-header">
        <span><i class="fas fa-list"></i> Мои домены</span>
      </div>
      <div id="custom-rules-list" class="rules-list">
        <div class="empty-rules">
          <i class="fas fa-info-circle"></i>
          <span>Нет заблокированных доменов</span>
        </div>
      </div>
    </div>

    <!-- Футер -->
    <div class="footer">
      <button id="open-settings" class="footer-btn">
        <i class="fas fa-cog"></i>
      </button>
      <button id="open-stats" class="footer-btn">
        <i class="fas fa-chart-line"></i>
      </button>
      <div class="version">
        <i class="fas fa-code-branch"></i>
        <span>1.0</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
