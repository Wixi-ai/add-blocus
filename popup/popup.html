<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="glass-container">
    <div class="header">
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <i class="fas fa-shield-alt"></i>
      </div>
      <div class="header-text">
        <h1>Прометей<span class="badge">MV3</span></h1>
        <p class="subtitle">Блокировщик рекламы</p>
      </div>
      <div class="status-indicator" id="status-indicator"></div>
    </div>

    <div class="power-card">
      <div class="power-switch-container">
        <span class="power-label">Защита</span>
        <label class="power-switch">
          <input type="checkbox" id="toggle-blocking">
          <span class="power-slider">
            <i class="fas fa-power-off"></i>
          </span>
        </label>
      </div>
      <div class="power-stats" id="status-text">Активен</div>
    </div>

    <div class="stats-row">
      <div class="stat-block">
        <i class="fas fa-ban stat-icon-small"></i>
        <div class="stat-block-info">
          <span class="stat-block-label">Заблокировано</span>
          <span class="stat-block-value" id="blocked-count">0</span>
        </div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-block">
        <i class="fas fa-shield-alt stat-icon-small"></i>
        <div class="stat-block-info">
          <span class="stat-block-label">Правил</span>
          <span class="stat-block-value" id="rules-count">7</span>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <i class="fas fa-globe"></i>
        <h3>Статистика блокировок</h3>
      </div>
      <p style="color: #ccc; font-size: 12px; margin: 0;">
        Всего заблокировано элементов: <span id="total-blocked">0</span>
      </p>
    </div>

    <div class="footer">
      <button id="open-settings" class="footer-btn">
        <i class="fas fa-cog"></i>
      </button>
      <div class="version">
        <i class="fas fa-code-branch"></i>
        <span>1.1</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
